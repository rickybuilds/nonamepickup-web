<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NoName TFC speedrun map leaderboard, recent runs, and world record progression.">
  <link rel="canonical" href="https://nonamepickup.servehalflife.com/speedrun-map.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Speedrun Map | NoName TFC">
  <meta property="og:description" content="View a NoName TFC speedrun map leaderboard and record progression.">
  <meta property="og:url" content="https://nonamepickup.servehalflife.com/speedrun-map.html">
  <meta name="twitter:card" content="summary">
  <title>NoName TFC | Speedrun Map</title>

  <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
  <link rel="shortcut icon" href="/assets/images/favicon.ico">
  <link rel="stylesheet" href="assets/css/app.css?v=20260627sitezoom1">
  <link rel="stylesheet" href="assets/css/style.css?v=20260618i">
  <link rel="stylesheet" href="assets/css/speedruns.css?v=20260624d">
  <script src="assets/js/main.js?v=20260618i" defer></script>
  <script src="assets/js/speedruns.js?v=20260626classfilter" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body class="bg-[#0a0c10] speedruns-page" data-speedruns-view="map">
  <header class="site-header">
    <div class="site-header-inner">
      <div class="nn-logo" aria-label="NoName TFC">
        <span class="logo-nn">NN</span>
        <span class="logo-slash">//</span>
        <span class="logo-tfc">TFC</span>
      </div>

      <nav class="site-nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="speedruns.html" aria-current="page">Speedruns</a>
        <a href="live.html" class="nav-live">LIVE</a>
        <a href="matches.html">Matches</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="analytics.html">Analytics</a>
        <a href="compare.html">Compare</a>
      </nav>

      <input id="global-search" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Search players..." aria-label="Search players" class="site-search">
    </div>
  </header>

  <main class="speedrun-main">
    <section class="speedrun-shell">
      <div class="speedrun-hero detail">
        <div>
          <p class="speedrun-kicker">MAP RECORDS</p>
          <h1 id="sr-map-title">Speedrun Map</h1>
          <p id="sr-map-subtitle" class="speedrun-subtitle">Loading map leaderboard...</p>
          <p id="speedrun-status" class="speedrun-updated"><a href="speedruns.html">Speedruns</a></p>
        </div>

        <section class="speedrun-summary detail" aria-label="Map summary">
          <article class="matches2-kpi"><span>World Record</span><strong id="sr-map-wr">-</strong></article>
          <article class="matches2-kpi"><span>Total Runs</span><strong id="sr-map-runs">-</strong></article>
          <article class="matches2-kpi"><span>Runners</span><strong id="sr-map-runners">-</strong></article>
          <article class="matches2-kpi"><span>Records</span><strong id="sr-map-records">-</strong></article>
          <article class="matches2-kpi"><span>Difficulty</span><strong id="sr-map-difficulty">-</strong></article>
        </section>
      </div>

      <div id="speedrun-error" class="speedrun-error" hidden></div>

      <section class="speedrun-section page-section">
        <div class="speedrun-section-heading">
          <div><span>01</span><h2>Leaderboard</h2></div>
          <div class="speedrun-filters">
            <select id="sr-map-class-filter" aria-label="Filter leaderboard by class">
              <option value="">All Classes</option>
            </select>
          </div>
        </div>
        <div class="speedrun-table-wrap leaderboard-table-wrap">
          <table class="speedrun-table">
            <thead><tr><th>Rank</th><th>Runner</th><th>Class</th><th>Time</th><th>Updated</th></tr></thead>
            <tbody id="sr-map-leaderboard"></tbody>
          </table>
        </div>
      </section>

      <section class="speedrun-section speedrun-columns two">
        <div>
          <div class="speedrun-section-heading compact"><div><span>02</span><h2>Recent Runs</h2></div></div>
          <div id="sr-map-recent" class="speedrun-list"></div>
        </div>
        <div>
          <div class="speedrun-section-heading compact"><div><span>03</span><h2>WR Progression</h2></div></div>
          <div id="sr-map-progression" class="speedrun-list progression"></div>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
