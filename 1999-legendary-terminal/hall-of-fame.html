<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HALL OF FAME — 1999 LEGENDARY TERMINAL</title>
  <link rel="stylesheet" href="css/terminal-1999.css">
</head>
<body class="crt">

  <div class="terminal-menu">
    <a href="index.html">[1] DASHBOARD</a>
    <a href="live.html">[2] LIVE OPS</a>
    <a href="leaderboard.html">[3] RANKS</a>
    <a href="maps.html">[4] MAPS</a>
    <a href="hall-of-fame.html" class="active">[5] HALL OF FAME</a>
    <button onclick="window.location='index.html'" class="old-button">DISCONNECT</button>
  </div>

  <div class="terminal-window" style="max-width:620px;margin:20px auto;">
    <div class="terminal-titlebar">
      <div class="title">HALL OF FAME - 1999 TERMINAL</div>
    </div>
    <div class="terminal-body">
      <pre id="hof-content" style="background:#000;border:1px solid #222;padding:8px;min-height:240px;font-size:12px;">RETRIEVING LEGENDS...</pre>
    </div>
  </div>

  <script src="js/terminal-1999.js"></script>
  <script>
    async function loadHOF() {
      const [mvps,top] = await Promise.all([
        window.NN1999.fetchAPI('/api/stats/mvps?limit=5'),
        window.NN1999.fetchAPI('/api/topplayers?days=30')
      ]);
      const el = document.getElementById('hof-content');
      let t = 'THE VETERANS WHO NEVER LEFT\n\n';
      (mvps?.data?.leaders||[]).forEach(l=>{
        t += `${l.player} - ${l.mvp_games} MVPs\n`;
      });
      t += '\nHOT STREAKS\n';
      (top?.data||[]).slice(0,4).forEach(p=>{
        t += `${p.player} +${Math.round(p.delta)} ELO\n`;
      });
      el.textContent = t;
    }
    window.onload = loadHOF;
  </script>
</body>
</html>
