<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELO RANKS — 1999 LEGENDARY TERMINAL</title>
  <link rel="stylesheet" href="css/terminal-1999.css">
</head>
<body class="crt">

  <div class="terminal-menu">
    <a href="index.html">[1] DASHBOARD</a>
    <a href="live.html">[2] LIVE OPS</a>
    <a href="leaderboard.html" class="active">[3] RANKS</a>
    <a href="maps.html">[4] MAPS</a>
    <a href="hall-of-fame.html">[5] HALL OF FAME</a>
    <button onclick="window.location='index.html'" class="old-button">DISCONNECT</button>
  </div>

  <div class="terminal-window" style="max-width:640px;margin:20px auto;">
    <div class="terminal-titlebar">
      <div class="title">ELO RANKS - 1999 TERMINAL</div>
    </div>
    <div class="terminal-body">
      <pre id="ranks-content" style="background:#000;border:1px solid #222;padding:8px;min-height:220px;font-size:12px;">LOADING...</pre>
    </div>
  </div>

  <script src="js/terminal-1999.js"></script>
  <script>
    async function loadRanks() {
      const d = await window.NN1999.fetchAPI('/api/leaderboard?limit=12');
      const el = document.getElementById('ranks-content');
      if (!d?.ok) { el.textContent='NO DATA'; return; }
      let t = 'RANK  PLAYER          RECORD\n';
      (d.data||[]).slice(0,10).forEach((p,i)=>{
        t += `${(i+1).toString().padEnd(5)} ${p.player.padEnd(15)} ${p.record}\n`;
      });
      el.textContent = t;
    }
    window.onload = loadRanks;
  </script>
</body>
</html>
