# Include in the EXISTING ordinary /api/ location, after checking nginx -T.
# Edit existing duplicate directives instead of adding a second copy.
# Do not include in WebSocket, live relay, or SSE locations.
gzip on;
gzip_types application/json;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 1;
gzip_proxied any;
