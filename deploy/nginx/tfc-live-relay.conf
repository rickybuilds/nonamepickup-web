# WebSocket UDP relay for /live/
# Include this inside the HTTPS server block for nonamepickup.servehalflife.com.
# Use ^~ so it wins over a regex /api location. The path is /api/live/relay,
# not /live/api — nginx already serves /live/ as static files.

location ^~ /api/live/relay {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
}
