# Add INSIDE the existing server { ... } block in tfcbot.conf.
# Keep the existing /api/, replay uploads, /refactor/, /hltv/ and SSL settings.
location = /ffl {
    return 301 https://nonamepickup.servehalflife.com/ffl/;
}

location ^~ /ffl/ {
    if ($scheme = http) {
        return 301 https://nonamepickup.servehalflife.com$request_uri;
    }

    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:4010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}
