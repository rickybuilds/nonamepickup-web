<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>NoName TFC | 4v4 Replay</title>
  <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
  <link rel="stylesheet" href="assets/css/app.css?v=20260627sitezoom1">
  <link rel="stylesheet" href="assets/css/style.css?v=20260618i">
  <link rel="stylesheet" href="assets/css/speedrun-replay.css?v=20260713freeroam5">
  <link rel="stylesheet" href="assets/css/pickup-replay.css?v=20260730pickup1">
  <script src="assets/js/main.js?v=20260618i" defer></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="assets/js/pickup-replay.js?v=20260730pickup7"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="bg-[#0a0c10] replay-page pickup-replay-page replay-playing">
  <header class="site-header">
    <div class="site-header-inner">
      <div class="nn-logo" aria-label="NoName TFC">
        <span class="logo-nn">NN</span><span class="logo-slash">//</span><span class="logo-tfc">TFC</span>
      </div>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="live.html">LIVE</a>
        <a href="matches.html" aria-current="page">Matches</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="analytics.html">Analytics</a>
      </nav>
      <input id="global-search" type="text" autocomplete="off" placeholder="Search players..." aria-label="Search players" class="site-search">
    </div>
  </header>

  <main class="replay-main">
    <section class="replay-stage pickup-replay-stage" aria-label="4v4 pickup replay viewer">
      <canvas id="replay-canvas"></canvas>
      <div id="replay-status" class="replay-status">Loading round metadata…</div>

      <section class="replay-topbar pickup-topbar" aria-label="Round details">
        <div>
          <p class="speedrun-kicker">4V4 REPLAY VIEWER</p>
          <h1 id="replay-title">Pickup Replay</h1>
          <p id="replay-subtitle">Preparing telemetry…</p>
        </div>
        <div class="pickup-round-badges">
          <span id="replay-round-status" class="pickup-badge">—</span>
          <span id="replay-camera-label" class="pickup-badge">POV</span>
        </div>
      </section>

      <aside class="pickup-roster-panel" aria-label="Round roster">
        <header>
          <span>PLAYERS</span>
          <strong id="pickup-roster-count">0 sessions</strong>
        </header>
        <div id="pickup-roster"></div>
      </aside>

      <aside class="pickup-event-panel" aria-label="Round events">
        <header><span>EVENT FEED</span><strong id="pickup-event-count">0</strong></header>
        <div id="pickup-events"></div>
      </aside>

      <section class="pickup-selected-player" aria-label="Selected player">
        <div>
          <span id="pickup-selected-team" class="pickup-team-dot"></span>
          <strong id="pickup-selected-name">Select a player</strong>
          <small id="pickup-selected-class">—</small>
        </div>
        <dl>
          <div><dt>HP</dt><dd id="pickup-stat-health">—</dd></div>
          <div><dt>Armor</dt><dd id="pickup-stat-armor">—</dd></div>
          <div><dt>Speed</dt><dd id="pickup-stat-speed">—</dd></div>
          <div><dt>Weapon</dt><dd id="pickup-stat-weapon">—</dd></div>
        </dl>
      </section>

      <section class="replay-controls pickup-controls" aria-label="Playback controls">
        <button id="replay-play" type="button" class="replay-button">Pause</button>
        <button id="replay-restart" type="button" class="replay-button secondary">Restart</button>
        <button id="replay-camera" type="button" class="replay-button secondary">Camera: POV</button>
        <button id="replay-projectiles" type="button" class="replay-button secondary active">Projectiles</button>
        <button id="replay-objectives" type="button" class="replay-button secondary active">Objectives</button>
        <div class="replay-speed" role="group" aria-label="Playback speed">
          <button type="button" data-speed="0.25">0.25x</button>
          <button type="button" data-speed="0.5">0.5x</button>
          <button type="button" data-speed="1" class="active">1x</button>
          <button type="button" data-speed="2">2x</button>
          <button type="button" data-speed="4">4x</button>
        </div>
        <label class="replay-scrubber">
          <span id="replay-clock">0:00.000</span>
          <input id="replay-slider" type="range" min="0" max="1000" step="1" value="0">
          <span id="replay-duration">0:00.000</span>
        </label>
      </section>

      <div id="pickup-free-help" class="replay-free-roam-help" hidden>
        <strong>FREE ROAM</strong><span>Click to capture mouse · WASD move · Q/E down/up · Esc release</span>
      </div>
    </section>
  </main>
</body>
</html>
