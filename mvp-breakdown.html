<body class="bg-[#0a0c10] matches-page">
<div class="site-bg-grid"></div>
<div class="site-bg-glow site-bg-glow-a"></div>
<div class="site-bg-glow site-bg-glow-b"></div>

<header class="site-header">
  <div class="site-header-inner">
    <div class="nn-logo" aria-label="NoName TFC">
      <span class="logo-nn">NN</span><span class="logo-slash">//</span><span class="logo-tfc">TFC</span>

    <nav class="site-nav">

<main class="mvpb-main">
  <section class="mvpb-hero">

      <p class="mvpb-kicker">NN MVP LAB</p>

  <section id="mvpb-results" class="mvpb-results" aria-live="polite">
    <div class="mvpb-empty">
      <strong>Enter a match ID to begin.</strong>
      <span>The breakdown uses the same formula and source statistics as the official NoName MVP result.</span>
    </div>
  </section>
