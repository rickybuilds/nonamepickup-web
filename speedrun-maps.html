<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NoName TFC speedrun map catalogue and mapping status.">
  <link rel="canonical" href="https://nonamepickup.servehalflife.com/speedrun-maps.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Speedrun Maps | NoName TFC">
  <meta property="og:description" content="Browse speedrun maps in the database and server map coverage.">
  <meta property="og:url" content="https://nonamepickup.servehalflife.com/speedrun-maps.html">
  <meta name="twitter:card" content="summary">
  <title>NoName TFC | Speedrun Maps</title>

  <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
  <link rel="shortcut icon" href="/assets/images/favicon.ico">
  <link rel="stylesheet" href="assets/css/app.css?v=20260716glow1">
  <link rel="stylesheet" href="assets/css/style.css?v=20260618i">
  <link rel="stylesheet" href="assets/css/speedruns.css?v=20260728catalogwr1">
  <script src="assets/js/main.js?v=20260618i" defer></script>
  <script src="assets/js/speedruns.js?v=20260728catalogwr1" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body class="bg-[#0a0c10] speedruns-page" data-speedruns-view="maps">
  <header class="site-header">
    <div class="site-header-inner">
      <div class="nn-logo" aria-label="NoName TFC">
        <span class="logo-nn">NN</span>
        <span class="logo-slash">//</span>
        <span class="logo-tfc">TFC</span>
      </div>

      <nav class="site-nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="speedruns.html" aria-current="page">Speedruns</a>
        <a href="live.html" class="nav-live">LIVE</a>
        <a href="matches.html">Matches</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="analytics.html">Analytics</a>
        <a href="compare.html">Compare</a>
      </nav>

      <input id="global-search" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Search players..." aria-label="Search players" class="site-search">
    </div>
  </header>

  <main class="speedrun-main">
    <section class="speedrun-shell">
      <div class="speedrun-hero detail">
        <div>
          <p class="speedrun-kicker">MAP CATALOGUE</p>
          <h1>Speedrun Maps</h1>
          <p class="speedrun-subtitle">Server map inventory, setup status, and maps still needing speedrun start and finish points.</p>
          <p id="speedrun-status" class="speedrun-updated"><a href="speedruns.html">Speedruns</a></p>
        </div>

        <section class="speedrun-summary detail" aria-label="Map catalogue summary">
          <article class="matches2-kpi"><span>Server Maps</span><strong id="sr-catalog-server">-</strong></article>
          <article class="matches2-kpi"><span>Configured</span><strong id="sr-catalog-configured">-</strong></article>
          <article class="matches2-kpi"><span>Not Logged</span><strong id="sr-catalog-not-logged">-</strong></article>
          <article class="matches2-kpi"><span>Needs Setup</span><strong id="sr-catalog-needs-setup">-</strong></article>
          <article class="matches2-kpi"><span>Records</span><strong id="sr-catalog-records">-</strong></article>
        </section>
      </div>

      <div id="speedrun-error" class="speedrun-error" hidden></div>

      <section class="speedrun-section page-section">
        <div class="speedrun-section-heading">
          <div><h2>Maps</h2></div>
          <div class="speedrun-filters">
            <input id="sr-catalog-search" type="search" placeholder="Search maps" autocomplete="off">
            <select id="sr-catalog-filter" aria-label="Filter maps">
              <option value="server">All Maps On Server</option>
              <option value="logged">Logged In DB</option>
              <option value="configured">Configured</option>
              <option value="not_logged">Not Logged</option>
              <option value="missing_start">Missing Start</option>
              <option value="missing_finish">Missing Finish</option>
              <option value="needs_setup">Needs Setup</option>
              <option value="records">Maps With Records</option>
            </select>
          </div>
        </div>
        <div class="speedrun-table-wrap speedrun-catalog-wrap">
          <table class="speedrun-table speedrun-catalog-table">
            <thead id="sr-catalog-head"></thead>
            <tbody id="sr-catalog-body"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
